[project]
name = "erpnext_es"
authors = [{ name = "Quest Media Hub" }]
description = "Corrected Latin American Spanish translation of ERPNext, shipped as its own app so ERPNext stays unchanged."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0" }
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191", "E101", "RUF001", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
